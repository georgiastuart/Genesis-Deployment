{{- if .Values.httproute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: genesis-httproute
  namespace: {{ .Release.Namespace }}
  annotations:
{{- range $key, $value := .Values.httproute.annotations }}
    {{ $key }}: "{{ $value }}"
{{- end }}
spec:
  hostnames:
  - {{ .Values.httproute.hostname }}
  parentRefs:
  {{- with .Values.httproute.parentRefs }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: genesis
      port: 3000
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
{{ end }}