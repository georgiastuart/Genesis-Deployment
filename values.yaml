image:
  registry: "junoinnovations"
  repository: "genesis"
  tag: "v6.9.1"
image_pull_secret:                          # Image pull secret to use for the project. This is the name of the secret in the namespace
host:                                       # Hostname to use for the Genesis ingress
pull_policy: Always                         # Pull policy to use for the Genesis image
env: {}                                     # Environment variables to set for the Genesis server

# Authentication endpoint — an nginx sidecar in the genesis pod that fronts
# Genesis's auth-service endpoint for external-auth edges (ingress-nginx
# auth-url): it accepts /api/auth-service/<name>/ for an arbitrary <name>,
# checks the session against genesis.<namespace>.svc.cluster.local:3000 and
# answers 302 to the original location on success / 401 otherwise
# (normalizing Genesis's login redirect, which auth_request-style edges
# would treat as a pass). Server config: files/genesis/nginx.conf
# (templated into the genesis-nginx ConfigMap); see
# templates/genesis/genesis-nginx.configmap.yaml.
nginx:
  enabled: true                             # Deploy the auth sidecar (and its service port)
  port: 8080                                # Port the sidecar listens on in the pod
  image:
    registry: "docker.io"
    repository: "nginx/nginx-unprivileged"
    tag: "1.31"
node_selector:                              # Node selector to deploy the Genesis server to
  enable: true                              # Enable node selector
  labels:                                   # Node selector to deploy the Genesis server to
    juno-innovations.com/service: "true"

# Primarily used for Juno-internal development to inject annotations to resources
extra_annotations: {}
genesis_token_creation_extra_annotations: {}


# https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
# If you run powerful controlplane nodes, you can reuse them to host core Orion services.
tolerations: []

titan:
  tolerations: []
  extra_annotations: []
  image:
    registry: "junoinnovations"
    repository: "titan"
    tag: "v2.2.3"
#  owner: bob                                # Optional. Owner of the cluster. If set, Titan creates this user on startup
#  email: test@email.com                     # Optional. Email for the owner of the cluster
#  uid: 1005                                 # Optional. UID of the owner of the cluster
  node_selector:                            # Node selector to deploy the Titan server to
    labels:                                 # Node selector to deploy the Titan server to
      juno-innovations.com/service: "true"
  autoscaling:
    min_replicas: 1                         # Minimum number of replicas to run
    max_replicas: 3                         # Maximum number of replicas to run

terra:
  tolerations: []
  extra_annotations: []
  image:
    registry: "junoinnovations"
    repository: "terra"
    tag: "v4.1.1"
  node_selector:                            # Node selector to deploy the Titan server to
    labels:                                 # Node selector to deploy the Titan server to
      juno-innovations.com/service: "true"
  resources:
    requests:
      cpu: 500m
      memory: 200Mi
    limits: {}
  autoscaling:
    min_replicas: 1                         # Minimum number of replicas to run
    max_replicas: 3                         # Maximum number of replicas to run

metricsGatherer:
  tolerations: []
  extra_annotations: []
  env: {}
  image:
    registry: "junoinnovations"
    repository: "metrics-gatherer"
    tag: "v1.1.0"
  node_selector:                            # Node selector to deploy the Titan server to
    labels:                                 # Node selector to deploy the Titan server to
      juno-innovations.com/service: "true"
  resources:
    requests:
      cpu: 500m
      memory: 200Mi
    limits: {}
  autoscaling:
    min_replicas: 1                         # Minimum number of replicas to run
    max_replicas: 1                         # Maximum number of replicas to run

rhea:
  image:
    registry: "junoinnovations"
    repository: "rhea"
    tag: "v1.2.3"
  env: 
    - name: NAMESPACED
      value: "true"                                   # Environment variables to set for Rhea
  resources:
    requests:
      cpu: 200m
      memory: 100Mi
    limits:
      cpu: 350m
      memory: 250Mi

# DEPRECATED — use ingress.className instead. Will be removed in a future release.
ingressClassName: nginx

# Service configuration for the external-facing genesis service
service:
  type: ClusterIP            # ClusterIP | LoadBalancer | NodePort
  annotations: {}            # Annotations applied to the genesis service

# Ingress configuration
ingress:
  enabled: true              # Toggle the ingress resource on/off
  className: ""              # Overrides root ingressClassName when set; falls back to it when empty
  annotations: {}            # Annotations applied to the ingress resource

# Gateway API HTTPRoute configuration
httproute:
  enabled: false
  hostname: 
  parentRefs: []
