# Auth-service endpoint: nginx sidecar in the genesis pod (templated into
# the genesis-nginx ConfigMap and mounted as /etc/nginx/nginx.conf).
#
# Sits between external-auth edges (ingress-nginx auth-url) and Genesis's
# real auth-service endpoint (genesis.<namespace>.svc.cluster.local:3000).
# ingress-nginx's external-auth uses auth_request semantics: 2xx/3xx from
# the auth endpoint let the request through, 401/403 send the client to
# the ingress's auth-signin URL. Genesis answers unauthenticated requests
# with a login redirect (302) — which auth_request would treat as success
# and let the request through unauthenticated (the argo-dashboard bypass).
# This sidecar normalizes the response:
#
#   - Genesis 2xx (valid session)      -> 302 to the original location
#     (a pass signal for the edge; a redirect for a direct browser hit)
#   - Genesis 3xx / 401 / 403          -> 401 (the edge redirects to login)
#   - anything else (misconfiguration) -> 500
#
# It accepts an unknown <name> under /api/auth-service/ — the path mirrors
# Genesis's endpoint for whatever secondary path the edge asks to check.
# Runs as the non-root nginx user (nginxinc/nginx-unprivileged) on a
# read-only root filesystem — pid, cache and logs use writable paths
# (the sidecar container mounts /tmp, /var/cache/nginx and /var/log/nginx
# as emptyDirs).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  server {
    listen {{ .Values.nginx.port }};
    listen [::]:{{ .Values.nginx.port }};

    # The auth endpoint, for an arbitrary (unknown) <name>: check the
    # session against Genesis's auth-service endpoint for the same path,
    # then 302 to the original location on success.
    location /api/auth-service/ {
      # Remember the path so the /auth subrequest can query Genesis for
      # the same /api/auth-service/<name>/ URL.
      set $auth_uri $request_uri;
      auth_request /auth;
      # The original location: the edge's external-auth subrequest carries
      # the client's original URI in X-Original-URI (set by ingress-nginx);
      # a direct browser hit has none, so fall back to the request URI.
      if ($http_x_original_uri = "") {
        return 302 $request_uri;
      }
      return 302 $http_x_original_uri;
    }

    # The auth subrequest: Genesis's auth-service endpoint, same path.
    # `internal` keeps it reachable only via auth_request. Normalize the
    # failure responses: 3xx (Genesis's login redirect) and 401/403 all
    # become 401 — auth_request would treat a 3xx as success and let the
    # request through. Any other status (e.g. a misconfigured endpoint)
    # surfaces as a 500.
    location = /auth {
      internal;
      proxy_pass http://genesis.{{ .Release.Namespace }}.svc.cluster.local:3000$auth_uri;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      # The client's original URI, as the edge's subrequest carried it —
      # what ingress-nginx would have sent to Genesis directly. Omitted
      # (empty value) for a direct browser hit.
      proxy_set_header X-Original-URI $http_x_original_uri;
      proxy_intercept_errors on;
      error_page 300 301 302 303 304 307 308 401 403 = 401;
    }
  }
}
